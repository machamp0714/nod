# 全文差し替えの宣言。規則で表せないファイルだけを、宣言した本文で丸ごと置き換える。generate.ts は本文に規則を当てないが、拒否リストでは検査する。
# 上流のファイルが無い、または指紋が upstreamSha256 と違えば生成は失敗する（上流の変更を見て、本文と指紋を人が更新する）。
# forks の各項目:
#   path            上流と生成物の相対パス（生成するスキルのディレクトリの中のファイル）
#   upstreamSha256  固定の記録のコミットの上流の、そのファイルのバイトの sha256（小文字の16進64桁）
#   body            このディレクトリからの相対パスの本文（例: forks/pstack/skills/setup-pstack/SKILL.md）
#   reason          差し替える理由（日本語）
forks:
  - path: pstack/skills/setup-pstack/SKILL.md
    upstreamSha256: 9347e6a17d41c92fd9d57e689c63d81defbd63df18dbcd5e9858ab03de5994ea
    body: forks/pstack/skills/setup-pstack/SKILL.md
    reason: Cursor の利用できるモデルを調べて ~/.cursor/rules/pstack-models.mdc に役割ごとのモデルを書く手順で、文を置き換えても OMP で通る手順にならない。OMP では役割ごとのモデルをエージェント定義と modelRoles で決めるので、OMP では使わないこと・実行を求められたら実行せずそう答えることを示す短い本文にする（スキルの一覧から外して生成には残す）
