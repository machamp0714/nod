  - id: task-poteto-mode-defaults
    reason: "Task の既定（run_in_background・readonly・役割ごとのモデルの slug・pstack-models.mdc・inherit-parent・Fable の例外・水準の選び方・/setup-pstack）を、OMP の task の呼び出しの形と、モデルを OMP のエージェント定義と modelRoles で決める文にする"
    files: "^pstack/skills/poteto-mode/SKILL\\.md$"
    literal: "**Defaults for every `Task` call.** `run_in_background: true`, agent mode (readonly strips MCP), file pointers not inlined context, and an explicit model per role, Project workers included. `/setup-pstack` writes `~/.cursor/rules/pstack-models.mdc`, whose per-role lines override the defaults below and the role models in the routed skills (`arena`, `swarm`, `interrogate`). A role with no line keeps its default. A line of `inherit-parent` or `auto` runs the role on the parent model, so omit `model` and spawn `generalPurpose`, because `poteto-agent` defaults to Opus 5.5. Each code playbook reads its own line (`feature, refactoring`, `bug-fix`, `perf-issue`, or `hillclimb`), prose and judgment read `judgment and prose`, and trivial mechanical edits read `swarm workers`. If the rule has no `# defaults: 3` line, an older setup wrote it. Keep honoring its lines, and tell the user once per session to rerun `/setup-pstack`.\n\n- Code, prose, and judgment: `claude-opus-5-5-xhigh-fast`.\n- Trivial mechanical edits: `claude-opus-5-5-high-fast`.\n- Diverse review and design panels: one runner each on `claude-fable-5-2-high`, `claude-opus-5-5-high-fast`, and `gemini-4-neon-xhigh`.\n\n**Fable 5.2 is an exception.** It runs outside a panel only when the user named it for this task or two Opus 5.5 xhigh runs of the same brief failed its check. Say which. Difficulty alone never qualifies.\n\n**Match the model to the job.** Start from the role's line or default, keep its family, and set the level the job needs. The `/setup-pstack` budget sets each role's starting level. Panel seats keep their listed level. Raise any other role one step, up to xhigh, for the hardest or subtlest work, lower it one step for judgment, and two or more steps for routine work. No role runs above xhigh. Opus 5.5 always runs its `-fast` slug. Verification always runs on the `swarm workers` model, `claude-opus-5-5-high-fast` by default. A Gemini seat runs at `gemini-4-neon-xhigh` unless its line names another level. If the Task tool rejects a slug, never pass it again. Fall back to the role's line or default, then the calling skill's fallback, then the closest valid slug of the same family, then omit `model`. Say so."
    replace: "**Defaults for every `task` call.** Call the `task` tool once with `{ context, tasks: [...] }`. `context` is the background every subagent shares, and it cannot be left out. Each item in `tasks` starts one subagent and holds only the fields the tool's schema has, such as `name`, `agent`, `task`, and `solutionSpace`. To start N subagents in one message, put N items in `tasks` of one call. Subagents run in the background, and their results arrive on their own, so call `wait` only when nothing else is left to do. Point at files by path in `task` or `context` instead of inlining them. A subagent can use the parent's MCP tools.\n\n**Models come from OMP's settings.** Never pass `model` or `effort` in a `task` item. The `task` tool accepts `model` only when the `task.perCallModel` setting is on, and this setup leaves models to the settings. Each subagent runs on the model and reasoning level of its agent definition and the user's `modelRoles` (`poteto-agent` uses the `task` role), and the routed skills (`arena`, `swarm`, `interrogate`) follow the same rule. This OMP setup does not use `/skill:setup-pstack` or its model rule. When the user wants other models or levels, tell them to change `modelRoles` in `~/.omp/agent/config.yml` or the Roles in `/model`. Do not edit their settings yourself.\n\n**Nesting stops at grandchildren.** A subagent can start subagents of its own, but a grandchild has no `task` tool, so it does the work itself."
