    literal: "Use Cursor's built-in `create-skill` skill to author the skill. Placement:\n\n- Path: preserve an existing mode skill's category. For a new mode, use `.cursor/skills/<handle>/<handle>-mode/SKILL.md` when the repo has an established personal category for that handle. Otherwise default to `.cursor/skills/<handle>-mode/SKILL.md` in the project (or `~/.cursor/skills/<handle>-mode/` if the user prefers a personal skill).\n- Handle: the user's first name or chosen identifier.\n- Frontmatter `description`: trigger on their name + `/<handle>-mode` + \"work in their style\", not on generic keywords like \"write code\" or \"review PR\".\n- Frontmatter formatting: follow `create-skill`'s YAML rules. Keep `description` as one YAML scalar. Quote it or use `description: >-` with indented continuation lines when punctuation or wrapping requires it.\n- Frontmatter `disable-model-invocation: true` by default. Opt out only if the user explicitly wants their mode to apply on every turn."
    replace: "Write the SKILL.md yourself in OMP's skill format. Do not count on a built-in skill-authoring skill. Placement:\n\n- Path: OMP reads skills one level below a skills directory, so the skill is `<skills dir>/<handle>-mode/SKILL.md`. For a new mode, use `.omp/skills/<handle>-mode/SKILL.md` in the target repository, or `~/.omp/agent/skills/<handle>-mode/SKILL.md` when the user prefers a personal skill. When step 0 found an existing mode skill where OMP reads it, edit that file in place. Never save into pstack's generated copy (where `skill://poteto-mode` resolves), because the next sync rewrites it.\n- Handle: the user's first name or chosen identifier. The skill's name is `<handle>-mode`.\n- Frontmatter `name`: `<handle>-mode`, the same as the directory name, with no `/` or `\\`.\n- Frontmatter `description`: one non-empty YAML string. Trigger on their name, `/skill:<handle>-mode`, and a request to work in their style, not on generic keywords like \"write code\" or \"review PR\" or on a general request to implement something. Quote it, or use `description: >-` with indented continuation lines when punctuation or wrapping requires it.\n- Frontmatter `disable-model-invocation: true` by default. It hides the skill from the model's skill list, so the skill is used only when loaded explicitly, with `/skill:<handle>-mode` or `read` on `skill://<handle>-mode`. Leave it out only if the user explicitly wants the skill listed to the model.\n- After writing, check the file: the frontmatter parses as YAML, `name` and `description` hold the values you meant, every file it references exists, and every reference to another skill (`skill://<name>`, `/skill:<name>`) resolves. Then run `omp skill list --json` in the target repository and confirm that the skill appears with the intended `name`, the `filePath` of the file you wrote, and `hide: true` (or `hide: false` when the user had `disable-model-invocation` left out)."
