  # ==== Cursor 固有の作業手順の変換 ====
  # 参照の変換（ref-）の後に当てる（literal は ref- の出力に当たるように書く）。文の単位で OMP の手順に書き換える。接頭辞は、task- が子の起動（task ツール）、
