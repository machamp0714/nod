name: CI

# 基点ブランチと paths で絞らない。絞ると必須チェックが出ないまま PR が待ち続けるため。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 自動の再試行（retry 系の action、continue-on-error）は入れない。不安定なテストを隠さないため。
# ジョブの名前は main の必須チェックの名前なので変えない（job id と name をそろえる）。
jobs:
  typecheck:
    name: typecheck
    runs-on: macos-latest
    steps:
      # ref を明示しない。pull_request では GitHub 既定の合成 merge commit（PR の head と基点の組み合わせ）を検査する。
      - uses: actions/checkout@v7
      # Bun の版は .bun-version の 1 か所で固定する。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: bun.lock の確認
        run: |
          if [ ! -f bun.lock ]; then
            echo "::error::bun.lock がありません。依存は lockfile から固定して入れます。"
            exit 1
          fi
      - name: 依存の導入
        run: bun install --frozen-lockfile
      - name: ルートの型検査
        run: bun run typecheck
      - name: Web のパッケージの型検査
        working-directory: packages/web
        run: bun run typecheck

  test:
    name: test
    runs-on: macos-latest
    # 手元の全体の実行は約 385 秒。ランナーの遅さと Rust・Swift のコンパイルの分の余裕を持たせる。
    timeout-minutes: 30
    steps:
      # ref を明示しない。pull_request では GitHub 既定の合成 merge commit（PR の head と基点の組み合わせ）を検査する。
      - uses: actions/checkout@v7
      # Bun の版は .bun-version の 1 か所で固定する。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: bun.lock の確認
        run: |
          if [ ! -f bun.lock ]; then
            echo "::error::bun.lock がありません。依存は lockfile から固定して入れます。"
            exit 1
          fi
      - name: 依存の導入
        run: bun install --frozen-lockfile
      # 通知のテストは cargo（Rust の harness）と swiftc（Swift の probe）が無いと黙って skip するため、
      # 先に道具があることを確かめる（無ければここで失敗する）。どちらも macOS ランナーの標準の構成に入っている。
      - name: Rust・Swift の道具の確認
        run: |
          cargo --version
          swiftc --version
      # 手元と同じ package.json の test スクリプト（既定のタイムアウト 30 秒）を使う。後ろの引数はそのまま bun test に渡る。
      - name: 全体のテスト
        run: bun run test --reporter=junit --reporter-outfile="$RUNNER_TEMP/bun-test-junit.xml"
      # テストが失敗しても照合を実行し、skip の不一致もログに残す。照合の失敗も test のチェックの失敗にする。
      - name: skip の照合
        if: ${{ !cancelled() }}
        run: bun scripts/check-test-skips.ts "$RUNNER_TEMP/bun-test-junit.xml" test/allowed-skips.json
      - name: JUnit の結果の保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bun-test-junit
          path: ${{ runner.temp }}/bun-test-junit.xml

  lint:
    name: lint
    runs-on: macos-latest
    steps:
      # ref を明示しない。pull_request では GitHub 既定の合成 merge commit（PR の head と基点の組み合わせ）を検査する。
      - uses: actions/checkout@v7
      # Bun の版は .bun-version の 1 か所で固定する。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: bun.lock の確認
        run: |
          if [ ! -f bun.lock ]; then
            echo "::error::bun.lock がありません。依存は lockfile から固定して入れます。"
            exit 1
          fi
      - name: 依存の導入
        run: bun install --frozen-lockfile
      # oxlint の既定の規則（correctness）で検査し、警告の扱いの診断も失敗にする（--deny-warnings）。
      - name: Lint
        run: bun run lint
