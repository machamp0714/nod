[package]
name = "nod-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nod_desktop"
path = "src/lib.rs"

[[bin]]
name = "nod-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
libc = "0.2"
tauri-plugin-single-instance = "2"
