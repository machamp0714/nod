[package]
name = "nod-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "nod_desktop"
path = "src/lib.rs"

[[bin]]
name = "nod-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
libc = "0.2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "block2"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSDictionary", "NSError"] }
objc2-user-notifications = { version = "0.3", features = ["block2"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
