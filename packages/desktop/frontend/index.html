<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>nod</title>
    <style>
      html, body { margin: 0; height: 100%; background: #161A21; color: #E6E8EC;
        font: 14px -apple-system, BlinkMacSystemFont, sans-serif; }
      body { display: grid; place-items: center; }
      main { text-align: center; }
      .spinner { width: 22px; height: 22px; margin: 0 auto 16px; border-radius: 50%;
        border: 2px solid #3A4150; border-top-color: #9AA4B8; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      p { margin: 0; }
      .sub { margin-top: 8px; color: #8B93A5; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <p>nod を起動しています…</p>
      <p class="sub">しばらくお待ちください</p>
    </main>
  </body>
</html>
